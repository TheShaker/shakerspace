<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<canvas id="starfield"></canvas>
<div class="neb n1"></div><div class="neb n2"></div><div class="neb n3"></div>
<div class="glow" id="glow"></div>
<button class="theme" id="themeBtn" title="Toggle theme">🌙</button>

<div class="wrap">
  <h1 class="title">dshaker.space</h1>
  <p class="sub">Mission Control</p>

  <div class="solar" id="solarWrap">
    <canvas id="solar"></canvas>
    <div class="sol-tip" id="solTip"></div>
  </div>

  <nav id="protoLinks" aria-label="Sub-sites" style="position:absolute;left:-9999px">
    <a class="sr-only" tabindex="0" href="dashboard.html">🛰️ Dashboard — system status &amp; diagnostics</a>
    <a class="sr-only" tabindex="0" href="eggs.html">🥚 Easter Eggs — hidden endpoints</a>

    <a class="sr-only" tabindex="0" href="kandan.html">🗂️ Kandan — kanban &amp; notes</a>
    <a class="sr-only" tabindex="0" href="contact.html">📡 Contact — reach the mothership</a>
  </nav>

  <div class="cli" id="cli">
    <div class="cliout" id="cliOut">
      <div class="clil">sputnik@space:~$ <span class="cliw">Type <span class="clih">HELP</span> for commands</span></div>
    </div>
    <div class="clirow">
      <span class="cliprompt">sputnik@space:~$ </span>
      <input class="cliin" id="cliIn" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>

  <div class="sts"><span class="stsd"></span> All systems nominal</div>
</div>

<script src="main.js?v=5"></script>
