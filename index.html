<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dshaker.space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="starfield"></canvas>
<div class="neb n1"></div><div class="neb n2"></div><div class="neb n3"></div>
<div class="glow" id="glow"></div>
<button class="theme" id="themeBtn" title="Toggle theme">🌙</button>

<div class="wrap">
  <div class="orbit">
    <div class="ring r1"><div class="rdot"></div></div>
    <div class="ring r2"><div class="rdot"></div></div>
    <div class="ring r3"><div class="rdot"></div></div>
    <div class="center"><span class="ico">🚀</span></div>
  </div>
  <h1 class="title">dshaker.space</h1>
  <p class="sub">Mission Control</p>

  <div class="appgrid">
    <a class="appcard" href="dashboard.html">
      <span class="appicon">🔬</span>
      <span class="appname">Dashboard</span>
      <span class="appdesc">System status &amp; diagnostics</span>
    </a>
    <a class="appcard" href="eggs.html">
      <span class="appicon">🎲</span>
      <span class="appname">Easter Eggs</span>
      <span class="appdesc">Hidden endpoints await</span>
    </a>
    <a class="appcard" href="retro.html">
      <span class="appicon">🕹️</span>
      <span class="appname">Retro Zone</span>
      <span class="appdesc">Windows 95 meets Geocities</span>
    </a>
    <a class="appcard" href="files.html">
      <span class="appicon">📁</span>
      <span class="appname">Files</span>
      <span class="appdesc">Upload, download, manage</span>
    </a>
    <a class="appcard" href="contact.html">
      <span class="appicon">📡</span>
      <span class="appname">Contact</span>
      <span class="appdesc">Reach the mothership</span>
    </a>
  </div>

  <div class="cli" id="cli">
    <div class="cliout" id="cliOut">
      <div class="clil">sputnik@space:~$ <span class="cliw">Type <span class="clih">HELP</span> for commands</span></div>
    </div>
    <div class="clirow">
      <span class="cliprompt">sputnik@space:~$ </span>
      <input class="cliin" id="cliIn" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>

  <div class="sts"><span class="stsd"></span> All systems nominal</div>
</div>

<script src="main.js"></script>
</body>
</html>
