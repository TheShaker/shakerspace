<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANDAN — dshaker.space</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&family=Shadows+Into+Light&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --n-purple:#7b2ff7;--n-blue:#2196f3;--n-pink:#f472b6;--star:#fbbf24;
  --void:#3a2413;--t1:#2b2119;--t2:rgba(43,33,25,.6);--t3:rgba(43,33,25,.35);
  --ok:#1f8a4c;--err:#c0392b;--card-y:#fff3a3;--card-p:#ffc9d8;--card-b:#cfe5ff;
  --card-g:#d4f2c8;--card-o:#ffe0b3;--tape:rgba(255,255,255,.55);
}
body{
  font-family:'Inter',sans-serif;color:var(--t1);min-height:100vh;overflow-x:hidden;
  /* Corkboard */
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,.06), transparent 60%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 1px, transparent 1px 5px),
    #a4703c;
}
.boardframe{max-width:1280px;margin:0 auto;padding:1.4rem 1.5rem 3rem}
/* wooden frame */
.boardframe::before, .boardframe::after{content:'';display:table}
.toolbar{background:rgba(58,36,19,.75);border:1px solid rgba(0,0,0,.4);border-radius:14px;padding:.8rem 1rem;margin-bottom:1.2rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toolbar h1{font-family:'Orbitron',sans-serif;font-size:1.3rem;letter-spacing:.12em;color:#ffe9c4;text-transform:uppercase;display:flex;align-items:center;gap:.5rem}
.toolbar .sub{color:rgba(255,233,196,.6);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-top:.2rem}
.actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.saved{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:#8bf0b0;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
button{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.04em;padding:.4rem .8rem;border-radius:8px;border:1px solid rgba(0,0,0,.35);background:rgba(255,255,255,.85);color:var(--t1);cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
button:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
button.primary{background:linear-gradient(135deg,#c98a2d,#7a4a12);color:#fff;border:none}
a.back{color:rgba(255,233,196,.85);text-decoration:none;font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:.08em}
a.back:hover{color:#fff}
select.filter{font-family:'JetBrains Mono',monospace;font-size:.7rem;padding:.35rem .55rem;border-radius:8px;border:1px solid rgba(0,0,0,.3);background:#fff;color:var(--t1)}

/* Board */
.board{display:flex;gap:1.1rem;align-items:flex-start;overflow-x:auto;padding-bottom:1rem}
.col{flex:1 1 270px;min-width:250px;max-width:310px;background:rgba(255,248,230,.45);border:1px solid rgba(0,0,0,.18);border-radius:14px;padding:.7rem;display:flex;flex-direction:column;gap:.6rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.col.ov{outline:3px dashed rgba(255,255,255,.7);outline-offset:-3px}
.coldrag{display:flex;align-items:center;gap:.4rem;font-family:'Shadows Into Light',cursive}
.colchev{background:transparent;border:none;box-shadow:none;padding:.1rem .3rem;font-size:1rem;color:var(--t1);cursor:pointer}
.colchev:hover{background:rgba(0,0,0,.1)}
.coltitle{flex:1;font-family:'Shadows Into Light',cursive;font-size:1.25rem;letter-spacing:.02em;background:transparent;border:none;outline:none;color:var(--t1);border-bottom:1px dashed rgba(0,0,0,.2)}
.colcount{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:rgba(43,33,25,.5)}
.mini{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;line-height:1;font-size:.7rem;opacity:.6;box-shadow:none;background:transparent;overflow:hidden;border-radius:6px}
.mini:hover{opacity:1;background:rgba(0,0,0,.1)}
.mini.on{opacity:1;color:var(--n-purple);background:rgba(255,255,255,.55)}
/* Per-column wrap: cap card titles at ~2 lines so a long column doesn't balloon.
   Toggle with the ⇕/≡ button on the column header. */
.col.wrap .ctext{height:2.6em !important;resize:none;overflow-y:auto}
.col.wrap .crow{align-items:flex-start}
.cards{display:flex;flex-direction:column;gap:.7rem;min-height:30px}
.cards.collapsed{display:none}
.colempty{font-family:'Shadows Into Light',cursive;color:rgba(43,33,25,.4);font-size:1rem;text-align:center;padding:.4rem;display:none}

/* Sticky notes */
.card{
  background:var(--card-y);color:#352b1a;border:1px solid rgba(0,0,0,.1);
  border-radius:2px;padding:.55rem .65rem .6rem;position:relative;
  box-shadow:0 4px 10px rgba(0,0,0,.28);transform:rotate(var(--rot,-1deg));
  transition:transform .15s,box-shadow .15s;
}
.card.c-pink{--card-y:var(--card-p)}.card.c-blue{--card-y:var(--card-b)}
.card.c-green{--card-y:var(--card-g)}.card.c-orange{--card-y:var(--card-o)}
.card.c-0{transform:rotate(-1.5deg)}.card.c-1{transform:rotate(.8deg)}
.card.c-2{transform:rotate(-.6deg)}.card.c-3{transform:rotate(1.3deg)}.card.c-4{transform:rotate(-1deg)}
.card:hover{transform:rotate(0) translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.card.dragging{opacity:.5;transform:rotate(6deg) scale(1.03);z-index:5}
.card::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);width:64px;height:18px;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:.9}
.cgrip{cursor:grab;cursor:-webkit-grab;color:rgba(43,33,25,.45);font-size:.95rem;line-height:1;margin-bottom:.25rem;user-select:none;-webkit-user-select:none;width:fit-content;touch-action:none}
.cgrip:active{cursor:grabbing}.cgrip:hover{color:rgba(43,33,25,.8)}
.crow{display:flex;gap:.45rem;align-items:flex-start}
.ctext{flex:1;background:transparent;border:none;outline:none;color:inherit;font-family:'Patrick Hand',cursive;font-size:1.18rem;width:100%;resize:none;min-height:1.2em;line-height:1.3}
.cmeta{display:flex;justify-content:space-between;align-items:center;margin-top:.3rem;gap:.3rem;flex-wrap:wrap}
.cdel{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;line-height:1;font-size:.75rem;opacity:.4;background:transparent;box-shadow:none;border:none;overflow:hidden;border-radius:6px}
.cdel:hover{opacity:1;color:var(--err);background:transparent}
.cdone{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;line-height:1;font-size:.8rem;font-weight:700;opacity:.4;background:transparent;box-shadow:none;border:none;overflow:hidden;border-radius:6px}
.cdone:hover{opacity:1;color:var(--ok);background:transparent}
/* Done-column cards recede: blend into the grey column bounding box */
.col.done .card{background:rgba(255,248,230,.4);color:rgba(43,33,25,.45);box-shadow:none;border-color:rgba(0,0,0,.06)}
.col.done .card::before{opacity:.25}
.col.done .card .ctext,.col.done .card .cgrip,.col.done .card .cdel,.col.done .card .cdone{color:rgba(43,33,25,.45)}
.col.done .card .cnotes{background:rgba(0,0,0,.04);color:rgba(43,33,25,.4)}
.cnotes{width:100%;background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.12);border-radius:4px;color:rgba(53,43,26,.75);font-family:'JetBrains Mono',monospace;font-size:.66rem;padding:.3rem .45rem;margin-top:.35rem;min-height:2em;resize:vertical;outline:none}
.cnotes:focus{background:rgba(255,255,255,.4)}
.ctagsel{font-family:'JetBrains Mono',monospace;font-size:.64rem;background:rgba(255,255,255,.6);color:var(--t1);border:1px solid rgba(0,0,0,.2);border-radius:5px;padding:.12rem .25rem;outline:none;cursor:pointer}
.tagchip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.08rem .4rem;border-radius:20px;letter-spacing:.02em;background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.15)}
.cdue{font-family:'JetBrains Mono',monospace;font-size:.64rem;padding:.1rem .35rem;border-radius:6px;background:rgba(0,0,0,.07);border:1px solid transparent}
.cdue.due{color:#1f5d8a;border-color:rgba(31,93,138,.4)}
.cdue.soon{color:#b06a00;background:rgba(255,180,0,.15);border-color:rgba(176,106,0,.5);font-weight:600}
.cdue.over{color:#fff;background:var(--err);border-color:var(--err);font-weight:700}
.dotbtn{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.15);cursor:pointer;padding:0;box-shadow:none}
.dotbtn:hover{transform:scale(1.2)}.d-yellow{background:var(--card-y)}.d-pink{background:var(--card-p)}
.d-blue{background:var(--card-b)}.d-green{background:var(--card-g)}.d-orange{background:var(--card-o)}
.duebtn{font-size:.68rem;padding:.1rem .3rem;box-shadow:none;background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.15)}
.duebtn:hover{background:rgba(0,0,0,.14)}
.prio{font-size:.6rem;line-height:1;padding:.08rem .22rem;box-shadow:none;background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.15);border-radius:4px;color:rgba(43,33,25,.75)}
.prio:hover{background:rgba(0,0,0,.16);color:var(--t1)}
.prio:disabled{opacity:.3;cursor:default;background:rgba(0,0,0,.03)}
.addcard{background:rgba(255,255,255,.5);border:1px dashed rgba(0,0,0,.3);border-radius:6px;color:rgba(43,33,25,.6);padding:.45rem;font-size:.7rem;cursor:pointer;text-align:left;font-family:'JetBrains Mono',monospace;box-shadow:none}
.addcard:hover{color:var(--n-blue);background:rgba(255,255,255,.7)}

/* Top box — dual-mode: Scratch & Dump OR Long Horizon (toggle via header) */
.scratch{margin:.4rem 0 2.2rem;background:var(--card-y);border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:.7rem 1rem .75rem;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.3);transform:rotate(.3deg);width:100%}
.scratch::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(1deg);width:74px;height:18px;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.scratchhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap}
.sbmode{font-family:'Shadows Into Light',cursive;font-size:1.3rem;letter-spacing:.02em;color:rgba(53,43,26,.6);background:transparent;border:none;box-shadow:none;padding:.15rem .35rem;border-radius:6px;opacity:.75;transition:all .2s}
.sbmode:hover{color:var(--n-purple);opacity:1;background:rgba(255,255,255,.4)}
.sbmode.active{color:var(--n-purple);opacity:1;background:rgba(255,255,255,.55)}
.sbmode .cnt{font-family:'JetBrains Mono',monospace;font-size:.74rem;font-weight:500;background:rgba(0,0,0,.08);border-radius:20px;padding:.05rem .42rem;margin-left:.25rem;vertical-align:middle}
/* Long Horizon mode: the whole box shifts to a purple sticky + the strip
   becomes a single horizontally-scrollable timeline row. */
.scratch.shz{background:linear-gradient(135deg,#e6dfff,#cbb7ff 60%,#b39dff);color:#2a1d45;box-shadow:0 6px 18px rgba(30,16,70,.45)}
.scratch.shz::before{background:rgba(255,255,255,.6)}
.scratch.shz .sbmode{color:rgba(42,29,69,.7)}
.scratch.shz .sbmode.active{color:#4315a3;background:rgba(255,255,255,.5)}
.horizonrow{display:flex;flex-direction:column;gap:.6rem;margin-top:.25rem}
.hzcards{display:flex;flex-direction:row;gap:.7rem;overflow-x:auto;padding:.15rem 0 .5rem;align-items:flex-start;min-height:20px;scrollbar-width:thin}
.hzcards .card{flex:0 0 auto;width:250px}
.scratchrow{display:flex;align-items:stretch;gap:.8rem}
#scratch{flex:1;background:rgba(255,255,255,.32);border:none;border-bottom:1px dashed rgba(0,0,0,.25);color:#35291a;font-family:'Patrick Hand',cursive;font-size:1.2rem;min-height:2.6em;resize:vertical;padding:.35rem .5rem;outline:none;line-height:1.4}
#scratch:focus{background:rgba(255,255,255,.5)}
.scratchbar{display:flex;align-items:center}

/* Gate */
.gate{position:fixed;inset:0;background:#2a180b;display:flex;align-items:center;justify-content:center;z-index:50}
.gatebox{background:#fff6e0;border:1px solid rgba(0,0,0,.25);border-radius:16px;padding:2rem 2.5rem;text-align:center;max-width:340px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.gatebox .glock{font-size:2.4rem;margin-bottom:.5rem}
.gatebox h2{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.14em;color:var(--t1);margin-bottom:.4rem}
.gatebox p{color:var(--t2);font-size:.75rem;margin-bottom:1.2rem}
.gatebox input{width:100%;background:#fff;border:1px solid rgba(0,0,0,.25);border-radius:8px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:.8rem;padding:.6rem .8rem;outline:none;margin-bottom:.8rem;text-align:center}
.gatebox input:focus{border-color:var(--n-purple)}
.gaterr{color:var(--err);font-size:.7rem;min-height:1em;margin-bottom:.4rem;font-family:'JetBrains Mono',monospace}
.hidden{display:none!important}
.dragghost{position:fixed;pointer-events:none;z-index:999;background:var(--card-y);border:1px solid rgba(0,0,0,.2);border-radius:4px;padding:.5rem .8rem;font-family:'Shadows Into Light',cursive;font-size:1.05rem;color:#352b1a;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:240px;transform:translate(-50%,-130%) rotate(-2deg)}
@media (max-width:600px){
  .board{flex-direction:column;align-items:stretch}
  .col{max-width:none}
}
</style>
</head>
<body>
<div class="boardframe" id="wrap">
  <div class="toolbar">
    <div>
      <h1>🗂️ KANDAN</h1>
      <div class="sub">corkboard scratch pad</div>
    </div>
    <div class="actions">
      <span class="saved" id="saved">✓ saved</span>
      <select class="filter" id="filter" onchange="setFilter(this.value)" title="Filter by tag">
        <option value="">All</option>
        <option value="__untagged">Untagged</option>
      </select>
      <button onclick="addTag()">+ Tag</button>
      <a class="back" href="index.html">← Home</a>
    </div>
  </div>
  <div class="scratch" id="topbox">
    <div class="scratchhead">
      <button class="sbmode active" id="modeScratch" onclick="setTopMode('scratch')">📝 Scratch &amp; Dump</button>
      <button class="sbmode" id="modeHorizon" onclick="setTopMode('horizon')">🌅 Long Horizon <span class="cnt" id="hzCount">0</span></button>
    </div>
    <div class="scratchrow" id="paneScratch">
      <textarea id="scratch" placeholder="Brain-dump here…"></textarea>
      <div class="scratchbar">
        <button class="primary" onclick="scratchToTask()">→ Turn into task</button>
      </div>
    </div>
    <div class="horizonrow" id="paneHorizon" style="display:none">
      <button class="addcard" onclick="addHorizon()">+ add long-horizon card</button>
      <div class="hzcards" id="hzCards"></div>
    </div>
  </div>

  <div class="board" id="board"></div>
</div>

<!-- hidden due picker (rendered, off-screen, so showPicker() works) -->
<input type="datetime-local" id="duePicker" aria-hidden="true"
       style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px;pointer-events:none">

<!-- Gate -->
<div class="gate" id="gate">
  <div class="gatebox">
    <div class="glock">🗂️</div>
    <h2>KANDAN LOCKED</h2>
    <p>Enter the board's write key to edit. Viewing stays public.</p>
    <input id="gateIn" type="password" placeholder="••••••" autocomplete="off">
    <div class="gaterr" id="gateErr"></div>
    <button class="primary" style="width:100%" onclick="unlock()">Unlock</button>
  </div>
</div>

<script>
// A personal scratch pad. Viewing is public; WRITING requires a key you enter
// once per browser session. The key is NOT in this public source — it's checked
// server-side against the KANDAN_KEY secret binding by /api/kandan (POST 403s
// without it). The page stores the key only in sessionStorage (clears on close).
const SESS_WK = 'kandan_write_key';
const LS_CACHE = 'kandan_cache';
let writeKey = sessionStorage.getItem(SESS_WK) || '';
const DEFAULT_TAGS = ['#home', '#work'];
const COLORS = ['', 'pink', 'blue', 'green', 'orange'];

let board = null;
let saveTimer = null;
let dirty = false;
let state = { filter: '' };

function uid(p){ return p + Math.random().toString(36).slice(2,9); }

// ---------- Gate ----------
async function unlock(){
  const v = document.getElementById('gateIn').value.trim();
  const err = document.getElementById('gateErr');
  if (!v){ err.textContent = 'enter the write key'; return; }
  const ok = await verifyKey(v);
  if (ok){
    writeKey = v;
    sessionStorage.setItem(SESS_WK, writeKey);
    openBoard();
  } else {
    err.textContent = '✗ access denied';
  }
  document.getElementById('gateIn').value = '';
}

// Confirm a typed key against the API (probe endpoint). If the API is unreachable
// (offline-cache mode) we allow unlock so the pad still renders.
async function verifyKey(k){
  try {
    const r = await fetch('/api/kandan?verify=1', {
      headers: { 'X-Kandan-Key': k }, cache: 'no-store'
    });
    if (r.status !== 200) return false;
    const d = await r.json();
    return d.authorized === true;
  } catch(e) { return true; }
}

// ---------- Load / save ----------
async function loadBoard(){
  try {
    const r = await fetch('/api/kandan', {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    board = d && d.columns ? migrate(d) : defaultBoard();
  } catch(e) {
    try { board = migrate(JSON.parse(localStorage.getItem(LS_CACHE) || 'null')) || defaultBoard(); }
    catch(_){ board = defaultBoard(); }
  }
  document.getElementById('scratch').value = board.scratch || '';
  renderTagsUI();
  render();
}

function migrate(d){
  if (!d) return null;
  if (!Array.isArray(d.columns)) return defaultBoard();
  let tags = Array.isArray(d.tags) ? d.tags.filter(t => typeof t === 'string') : DEFAULT_TAGS.slice();
  d.columns.forEach(c => {
    if (!Array.isArray(c.cards)) c.cards = [];
    if (c.collapsed === undefined) c.collapsed = (c.title || '').toLowerCase().indexOf('done') !== -1;
    if (c.wrap === undefined) c.wrap = false;
    (c.cards || []).forEach(cd => {
      if (!cd.tag) cd.tag = '';
      if (!cd.notes) cd.notes = '';
      if (!cd.color) cd.color = '';
      if (!cd.due) cd.due = null;
      if (cd.tag && !tags.includes(cd.tag) && !DEFAULT_TAGS.includes(cd.tag)) tags.push(cd.tag);
    });
  });
  if (d.scratch === undefined && Array.isArray(d.notes)) {
    d.scratch = d.notes.map(n => n && n.text || '').join('\n');
  }
  if (typeof d.scratch !== 'string') d.scratch = '';
  if (!Array.isArray(d.horizon)) d.horizon = [];
  d.horizon.forEach(cd => {
    if (!cd || typeof cd !== 'object') return;
    if (!cd.text) cd.text = '';
    if (!cd.notes) cd.notes = '';
    if (!cd.tag) cd.tag = '';
    if (!cd.color) cd.color = '';
    if (!cd.due) cd.due = null;
    if (cd.tag && !tags.includes(cd.tag) && !DEFAULT_TAGS.includes(cd.tag)) tags.push(cd.tag);
  });
  d.tags = tags;
  return d;
}

function defaultBoard(){
  return {
    columns: [
      {id:uid('c'), title:'Backlog', cards:[], collapsed:false, wrap:true},
      {id:uid('c'), title:'Doing',   cards:[], collapsed:false, wrap:false},
      {id:uid('c'), title:'Done',    cards:[], collapsed:true,  wrap:false}
    ],
    scratch: '',
    horizon: [],
    tags: DEFAULT_TAGS.slice()
  };
}

function captureScratch(){ if (board) board.scratch = document.getElementById('scratch').value; }

function scheduleSave(){
  dirty = true;
  captureScratch();
  localStorage.setItem(LS_CACHE, JSON.stringify(board));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);
}

async function save(){
  const el = document.getElementById('saved');
  captureScratch();
  try {
    const r = await fetch('/api/kandan', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Kandan-Key': writeKey},
      body: JSON.stringify(board)
    });
    if (r.ok && dirty){ dirty=false; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1500); }
  } catch(e) { /* keep cache; retry on next edit */ }
}

// ---------- Filter ----------
function setFilter(v){
  state.filter = v;
  render();
}
function passesFilter(cd){
  if (!state.filter) return true;
  if (state.filter === '__untagged') return !cd.tag;
  return cd.tag === state.filter;
}

// ---------- Tags UI ----------
function renderTagsUI(){
  const sel = document.getElementById('filter');
  const cur = state.filter;
  ['', '__untagged'].concat((board.tags || []).slice()).forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t === '' ? 'All' : t === '__untagged' ? 'Untagged' : t;
    sel.appendChild(o);
  });
  if (cur) sel.value = cur;
}
function addTag(){
  const t = prompt('New tag (e.g. #homelab, #school):', '#');
  if (!t) return;
  let tag = t.trim();
  if (!tag) return;
  if (tag[0] !== '#') tag = '#' + tag;
  if (!board.tags.includes(tag)) board.tags.push(tag);
  scheduleSave(); renderTagsUI();
}

// ---------- Render ----------
function render(){
  const bd = document.getElementById('board');
  bd.innerHTML = '';
  board.columns.forEach(col => {
    const sec = document.createElement('section');
    sec.className = 'col' + ((col.title||'').toLowerCase().indexOf('done') !== -1 ? ' done' : '') + (col.wrap ? ' wrap' : '');
    sec.dataset.col = col.id;

    const hdr = document.createElement('div');
    hdr.className = 'coldrag';
    const ch = document.createElement('button');
    ch.className = 'colchev'; ch.title = 'Collapse / expand';
    ch.textContent = col.collapsed ? '▶' : '▼';
    ch.onclick = ()=>{ col.collapsed = !col.collapsed; scheduleSave(); render(); };
    const inp = document.createElement('input');
    inp.className = 'coltitle'; inp.value = col.title;
    inp.placeholder = 'Column name';
    inp.oninput = ()=>{ col.title = inp.value; scheduleSave(); };
    const cnt = document.createElement('span');
    cnt.className = 'colcount'; cnt.textContent = col.cards.length;
    const wrap = document.createElement('button');
    wrap.className = 'mini' + (col.wrap ? ' on' : '');
    wrap.textContent = col.wrap ? '≡' : '⇕'; wrap.title = 'Wrap card titles: on = cap at 2 lines (toggles this column)';
    wrap.onclick = ()=>{ col.wrap = !col.wrap; scheduleSave(); render(); };
    const del = document.createElement('button');
    del.className = 'mini'; del.textContent = '✕'; del.title='Delete column';
    del.onclick = ()=>{ if(confirm('Delete column "'+col.title+'" and its cards?')){ board.columns = board.columns.filter(c=>c!==col); scheduleSave(); render(); } };
    hdr.append(ch, inp, cnt, wrap, del);

    const cards = document.createElement('div');
    cards.className = 'cards' + (col.collapsed ? ' collapsed' : '');
    cards.dataset.col = col.id;

    const shown = col.cards.filter(passesFilter);
    col.cards.forEach((cd, idx) => { if (passesFilter(cd)) cards.appendChild(cardEl(cd, col, idx)); });

    const empty = document.createElement('div');
    empty.className = 'colempty';
    if (!col.collapsed && !shown.length) empty.style.display = 'block';
    empty.textContent = state.filter ? 'no matches' : 'empty';

    const add = document.createElement('button');
    add.className = 'addcard'; add.textContent = col.collapsed ? '' : '+ add card';
    add.style.display = col.collapsed ? 'none' : '';
    add.onclick = ()=>{ const cd={id:uid('k'),text:'',notes:'',tag:'',color:'',due:null}; col.cards.push(cd); scheduleSave(); render(); };

    sec.append(hdr, cards, empty, add);
    bd.appendChild(sec);
  });

  // Long Horizon — render into the top-box panel + live count
  const hz = document.getElementById('hzCards');
  hz.innerHTML = '';
  (board.horizon || []).forEach((cd, idx) => hz.appendChild(horizonCardEl(cd, idx)));
  document.getElementById('hzCount').textContent = (board.horizon || []).length;
}

function cardEl(cd, col, idx){
  const div = document.createElement('div');
  div.className = 'card c-' + (idx % 5);
  if (cd.color && COLORS.includes(cd.color)) div.classList.add('c-' + cd.color);

  const grip = document.createElement('div');
  grip.className = 'cgrip'; grip.textContent = '⠿';
  grip.title = 'Drag to move card';
  grip.addEventListener('pointerdown', e => startDrag(e, cd, col, div));
  grip.addEventListener('touchstart', e => e.preventDefault(), {passive:false});

  const row = document.createElement('div');
  row.className = 'crow';

  const ta = document.createElement('textarea');
  ta.className = 'ctext';
  ta.rows = 1; ta.placeholder = 'Task…'; ta.value = cd.text;
  ta.oninput = ()=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; cd.text = ta.value; scheduleSave(); };
  row.appendChild(ta);
  // Size after the card is mounted so saved multi-line / long titles render fully
  // on load — a detached element reports scrollHeight=0, so we wait a frame.
  requestAnimationFrame(()=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });

  // Tag dropdown (custom tag list)
  const sel = document.createElement('select');
  sel.className = 'ctagsel'; sel.title = 'Tag';
  const o0 = document.createElement('option'); o0.value=''; o0.textContent='—'; sel.appendChild(o0);
  (board.tags || []).forEach(t => {
    const o = document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o);
  });
  sel.value = cd.tag || '';
  sel.onchange = ()=>{ cd.tag = sel.value || ''; scheduleSave(); render(); };
  row.appendChild(sel);

  const meta = document.createElement('div');
  meta.className = 'cmeta';
  const left = document.createElement('span');
  left.style.display='flex'; left.style.alignItems='center'; left.style.gap='.3rem'; left.style.flexWrap='wrap';
  if (cd.tag) { const chip = document.createElement('span'); chip.className='tagchip'; chip.textContent=cd.tag; left.appendChild(chip); }
  // Priority control: slot number flanked by move-up / move-down arrows.
  // Drag on the grip reorders too, but this is the clickable alternative.
  const prioW = document.createElement('span');
  prioW.style.display='flex'; prioW.style.alignItems='center'; prioW.style.gap='.12rem';
  const up = document.createElement('button');
  up.className = 'prio'; up.textContent = '▲'; up.title = 'Move up (raise priority)';
  up.disabled = (col.cards.indexOf(cd) === 0);
  up.onclick = (e)=>{ e.stopPropagation(); moveCard(col, cd, -1); };
  const num = document.createElement('span');
  num.className = 'colcount'; num.textContent = (col.cards.indexOf(cd)+1);
  const dn = document.createElement('button');
  dn.className = 'prio'; dn.textContent = '▼'; dn.title = 'Move down (lower priority)';
  dn.disabled = (col.cards.indexOf(cd) === col.cards.length-1);
  dn.onclick = (e)=>{ e.stopPropagation(); moveCard(col, cd, 1); };
  prioW.append(up, num, dn);
  left.appendChild(prioW);

  const right = document.createElement('span');
  right.style.display='flex'; right.style.alignItems='center'; right.style.gap='.2rem';
  // color dots
  const dots = document.createElement('span');
  dots.style.display='flex'; dots.style.gap='.15rem';
  COLORS.forEach(c => {
    const d = document.createElement('button');
    d.className = 'dotbtn ' + (c ? 'd-'+c : 'd-yellow');
    d.title = 'Sticky color' + (c ? ' '+c : ' (yellow)');
    d.style.outline = (cd.color === c) ? '2px solid #333' : '';
    d.onclick = ()=> { cd.color = c; scheduleSave(); render(); };
    dots.appendChild(d);
  });
  right.appendChild(dots);
  // due button
  const db = document.createElement('button');
  db.className = 'duebtn'; db.textContent = cd.due ? '⏱' : '⏱ +';
  db.title = cd.due ? 'Due ' + fmtDate(cd.due) + ' — click to change' : 'Set a due time';
  db.onclick = (e)=> setDue(cd, e);
  right.appendChild(db);
  // Done checkbox — hidden on cards already sitting in the Done column
  const inDoneCol = (col.title||'').toLowerCase().indexOf('done') !== -1;
  if (!inDoneCol){
    const done = document.createElement('button');
    done.className = 'cdone'; done.textContent = '✓';
    done.title = 'Mark done (move to Done)';
    done.onclick = (e)=>{ e.stopPropagation(); markDone(cd, col); };
    right.appendChild(done);
  }
  const del = document.createElement('button');
  del.className = 'cdel'; del.textContent = '✕';
  del.onclick = ()=>{ col.cards = col.cards.filter(x=>x!==cd); scheduleSave(); render(); };
  right.appendChild(del);
  meta.append(left, right);

  const nt = document.createElement('textarea');
  nt.className = 'cnotes'; nt.placeholder = 'details…'; nt.value = cd.notes || '';
  nt.oninput = ()=>{ cd.notes = nt.value; scheduleSave(); };

  // due countdown label (click to clear when set)
  const due = document.createElement('div');
  due.className = 'cdue'; due.dataset.card = cd.id;
  if (cd.due){ due.style.cursor='pointer'; due.title='Click to clear due time'; due.onclick=()=>clearDue(cd); }
  updateDueLabel(due, cd);

  div.dataset.card = cd.id;
  div.append(grip, row, meta, nt, due);
  return div;
}

// ---------- Due times ----------
function fmtDate(iso){
  try {
    const d = new Date(iso);
    const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    return wd + ' ' + d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' +
      d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  } catch(e){ return ''; }
}
function updateDueLabel(el, cd){
  const c = cd.due ? new Date(cd.due) : null;
  if (!c || isNaN(c)){ el.style.display='none'; el.textContent=''; return; }
  el.style.display='';
  const now = Date.now();
  const diff = c - now;
  if (diff < 0) {
    const mins = Math.ceil(-diff/60000);
    el.textContent = mins < 60 ? ('❗ ' + mins + 'm overdue') : ('❗ ' + Math.ceil(mins/60) + 'h overdue');
    el.className = 'cdue over';
  } else if (diff < 60*60*1000) {
    const mins = Math.max(1, Math.floor(diff/60000));
    el.textContent = '⏳ ' + mins + 'm left';
    el.className = 'cdue soon';
  } else {
    const hrs = diff/(60*60*1000);
    const h = Math.floor(hrs), m = Math.floor((hrs-h)*60);
    el.textContent = (h>=24 ? Math.floor(h/24)+'d '+(h%24)+'h' : h+'h '+m+'m') + ' left';
    el.className = 'cdue due';
  }
}
function setDue(cd, e){
  const picker = document.getElementById('duePicker');
  picker._card = cd;
  const base = cd.due ? new Date(cd.due) : new Date(Date.now() + 24*60*60*1000);
  picker.value = toLocalInput(base);
  // Park the (native) picker right under the pointer before opening. The native
  // popup anchors to the input element, so when it sat at left:-9999px the popup
  // opened off-screen on desktop (= "nothing happens"). Mobile is unaffected.
  const x = e && e.clientX ? e.clientX : Math.round(innerWidth/2);
  const y = e && e.clientY ? e.clientY : 40;
  picker.style.cssText = 'position:fixed;left:'+x+'px;top:'+y+'px;opacity:0;width:2px;height:2px;pointer-events:none;z-index:99';
  if (picker.showPicker){ try { picker.showPicker(); } catch(err){ picker.focus(); } }
  else picker.click();
}
function toLocalInput(d){
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,16);
}

function clearDue(cd){ cd.due = null; scheduleSave(); render(); }

// ---------- Drag (pointer-based) ----------
let dragCard = null, dragFrom = null, dragGhost = null, overCol = null, dragY = 0, dragX = null, dragCancelled = false;
function colFromPoint(x, y){
  const el = document.elementFromPoint(x, y);
  const colEl = el && el.closest ? el.closest('.col') : null;
  return colEl ? (board.columns.find(c=>c.id===colEl.dataset.col) || null) : null;
}
/* Map a pointer Y onto an insertion array-index within a column. Renders with an
   active tag filter hide some cards, so we index by translating rendered DOM order
   back to real array positions (hidden cards keep their slots). */
function insertionIndex(col, cardsEl, y){
  const dom = Array.from(cardsEl.querySelectorAll(':scope > .card:not(.dragging)'));
  const order = dom.map(el => col.cards.findIndex(cd => cd.id === el.dataset.card));
  let before = order.length;
  for (let i=0;i<dom.length;i++){
    const r = dom[i].getBoundingClientRect();
    if (y < r.top + r.height/2){ before = i; break; }
  }
  if (before <= 0) return 0;
  return order[before-1] + 1;
}
function startDrag(e, cd, col, div){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (dragCard) endDrag();
  e.preventDefault();
  dragCard = cd; dragFrom = col; dragCancelled = false;
  dragX = e.clientX; dragY = e.clientY;
  div.classList.add('dragging');
  const ghost = document.createElement('div');
  ghost.className = 'dragghost';
  ghost.textContent = (cd.text || 'untitled').slice(0,60);
  document.body.appendChild(ghost);
  dragGhost = ghost;
  positionGhost(e);
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', onDragCancel);
  document.body.style.overflow = 'hidden';
}
function onDragCancel(){ dragCancelled = true; endDrag(); }
function positionGhost(e){
  if (dragGhost){ dragGhost.style.left = e.clientX+'px'; dragGhost.style.top = e.clientY+'px'; }
}
function onDragMove(e){
  positionGhost(e); e.preventDefault();
  dragY = e.clientY; dragX = e.clientX;
  document.querySelectorAll('.col.ov').forEach(c=>c.classList.remove('ov'));
  const col = colFromPoint(e.clientX, e.clientY);
  if (col){ const sec = document.querySelector('.col[data-col="'+col.id+'"]'); if (sec) sec.classList.add('ov'); }
  overCol = col;
}
function endDrag(){
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', onDragCancel);
  document.body.style.overflow = '';
  if (dragGhost){ dragGhost.remove(); dragGhost=null; }
  document.querySelectorAll('.card.dragging').forEach(c=>c.classList.remove('dragging'));
  document.querySelectorAll('.col.ov').forEach(c=>c.classList.remove('ov'));
  const cancelled = dragCancelled;
  const target = overCol, cd = dragCard, from = dragFrom, dropX = dragX;
  overCol = null; dragCard = null; dragFrom = null; dragX = null; dragCancelled = false;
  if (!cd || !from) return;
  const srcIdx = from.cards.indexOf(cd);
  if (srcIdx === -1){ render(); return; }
  if (cancelled){ render(); return; }
  if (target){
    // Determine the insertion array-index in the target column from the drop point.
    let k;
    const sec = document.querySelector('.col[data-col="'+target.id+'"]');
    const cardsEl = sec && sec.querySelector('.cards');
    if (cardsEl && !target.collapsed) k = insertionIndex(target, cardsEl, dragY);
    else k = target.cards.length;
    from.cards.splice(srcIdx, 1);
    if (target === from){
      if (k > srcIdx) k--;              // shift for the just-removed card
      from.cards.splice(k, 0, cd);      // reorder within the same column (priority)
    } else {
      if (target.collapsed) target.collapsed = false; // auto-expand so it's visible
      target.cards.splice(k, 0, cd);
    }
    scheduleSave(); render();
  } else if (dropX !== null){
    // Dropped in the gutter between/around columns.
    // Promote-to-horizon(above the board strip) only applies when the card came
    // from a REAL board column. A horizon card dragged within its own strip must
    // NOT re-promote itself (its pseudo-column sits above the board, so it would
    // just get flipped to the end of the list).
    if (board.columns.includes(from)){
      const boardEl = document.getElementById('board');
      const boardTop = boardEl ? boardEl.getBoundingClientRect().top : null;
      if (boardTop !== null && dragY < boardTop){
        from.cards.splice(srcIdx, 1);
        if (!board.horizon) board.horizon = [];
        board.horizon.push(cd);
        scheduleSave(); render();
        return;
      }
    }
    // Flick: released in the gutter beside the source column — hop to the
    // adjacent column to the left or right, no precise placement needed.
    const sColIdx = board.columns.indexOf(from);
    const sec = document.querySelector('.col[data-col="'+from.id+'"]');
    const rect = sec ? sec.getBoundingClientRect() : null;
    let destIdx = -1;
    if (rect){
      if (dropX < rect.left) destIdx = sColIdx - 1;        // flick left
      else if (dropX > rect.right) destIdx = sColIdx + 1;  // flick right
    }
    if (destIdx >= 0 && destIdx < board.columns.length){
      const dest = board.columns[destIdx];
      from.cards.splice(srcIdx, 1);
      if (dest.collapsed) dest.collapsed = false;
      dest.cards.push(cd);
      scheduleSave(); render();
    } else {
      render();
    }
  } else {
    render();
  }
}
function moveCard(col, cd, delta){
  const i = col.cards.indexOf(cd);
  const j = i + delta;
  if (i === -1 || j < 0 || j >= col.cards.length) return;
  col.cards.splice(i, 1);
  col.cards.splice(j, 0, cd);
  scheduleSave(); render();
}

  document.getElementById('modeHorizon').classList.toggle('active', m === 'horizon');
}
function horizonRef(){ return { id:'hz', title:'Long Horizon', cards: board.horizon, collapsed:false }; }
function addHorizon(){
  if (!board.horizon) board.horizon = [];

  const target = board.columns[0];
  if (target){ if (target.collapsed) target.collapsed = false; target.cards.unshift(cd); }
  scheduleSave(); render();
}

// ---------- Countdown ticker ----------
setInterval(()=>{
  if (!board || !dragCard) {
    document.querySelectorAll('.cdue').forEach(el=>{
      const cd = board && findCard(el.dataset.card);
      if (cd) updateDueLabel(el, cd);
    });
  }
}, 30000);
function findCard(id){
  if (!board) return null;
  for (const c of board.columns){ const f=c.cards.find(x=>x.id===id); if (f) return f; }
  return (board.horizon||[]).find(x=>x.id===id) || null;
}

// ---------- Mutations ----------
function markDone(cd, col){
  let doneCol = board.columns.find(c => (c.title||'').toLowerCase().indexOf('done') !== -1);
  if (!doneCol) doneCol = board.columns[board.columns.length - 1];
  col.cards = col.cards.filter(x => x !== cd);
  if (doneCol.collapsed) doneCol.collapsed = false;
  doneCol.cards.push(cd);
  scheduleSave(); render();
}
function scratchToTask(){
  if (!board) return;
  const text = document.getElementById('scratch').value.trim();
  if (!text){ alert('Scratch is empty — nothing to turn into a task.'); return; }
  const target = board.columns[0];
  target.cards.push({ id:uid('k'), text: text, notes:'', tag: state.filter && state.filter[0]==='#' ? state.filter : '', color:'', due:null });
  if (target.collapsed) target.collapsed = false;
  board.scratch = '';
  document.getElementById('scratch').value = '';
  scheduleSave(); render();
  const el = document.getElementById('saved');
  el.textContent = '✓ task created'; el.classList.add('on');
  setTimeout(()=>{ el.textContent='✓ saved'; el.classList.remove('on'); },1600);
}

  document.getElementById('gate').classList.add('hidden');
  document.getElementById('wrap').classList.remove('hidden');
  loadBoard();
}
document.getElementById('scratch').addEventListener('input', scheduleSave);
document.getElementById('duePicker').addEventListener('change', e=>{
  const cd = e.target._card;
  if (!cd) return;
  if (!e.target.value){ cd.due = null; }
  else { cd.due = new Date(e.target.value).toISOString(); }
  scheduleSave(); render();
});
if (writeKey){
  openBoard();
} else {
  document.getElementById('wrap').classList.add('hidden');
  document.getElementById('gateIn').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
  document.getElementById('gateIn').focus();
}
</script>
</body>
</html>
