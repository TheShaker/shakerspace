<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost in Space — dshaker.space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="starfield"></canvas>
<div class="neb n1"></div><div class="neb n2"></div><div class="neb n3"></div>
<div class="glow" id="glow"></div>
<button class="theme" id="themeBtn" title="Toggle theme">🌙</button>

<div class="wrap">
  <div class="orbit">
    <div class="ring r1"><div class="rdot"></div></div>
    <div class="ring r2"><div class="rdot"></div></div>
    <div class="center"><span class="ico">🛰️</span></div>
  </div>
  <h1 class="title">404</h1>
  <p class="sub">This signal is lost in deep space</p>
  <p class="ss" style="margin-top:1rem">The page you're looking for drifted off the star map.</p>
  <div style="margin-top:2rem">
    <a class="appcard" style="display:inline-flex;text-decoration:none" href="index.html">
      <span class="appicon">🚀</span>
      <span class="appname">Return to Mission Control</span>
    </a>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
